    lifecycle: active
    visibility: public
    intended_visibility: private
    data_class: public
    default_branch: main
    licence: notice
    deploys_to: [testflight, app-store]
    depends_on: [Algorythmos-AI/sggs-data, Algorythmos-AI/sggs-platform]
    notes: Consumes sggs-data by commit + sha256 (dataset.lock.json). If sggs-data goes private, CI needs a read token.
