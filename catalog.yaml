# Algorythmos repository catalog — the single source of truth for what lives where.
#
# Humans: edit this file, then run `make render` and commit both files.
# Agents: read this file first. Never infer ownership, visibility or deploy targets from memory.
# `make validate` checks every entry against live GitHub (existence, visibility, default branch).
#
# Enums (enforced by scripts/catalog.py):
#   kind:        app | service | web | data | monorepo | library | infra | docs | ops | config
#   lifecycle:   active | dormant | deprecated | archived | planned
#                (the validator warns when an 'active' repo has had no push for 120 days)
#   visibility / intended_visibility: public | private
#   data_class:  public | internal | confidential | restricted
#   location:    org (Algorythmos-AI) | personal (skalaliya — to migrate)
#   licence:     proprietary (LICENSE, Algorythmos Pty Ltd) | notice (NOTICE.md) | pending (owner decision) | n/a
#   url:         optional — the live URL a newcomer can open (rendered as "Live at"); must answer 200

version: 1
updated: 2026-11-17

# Words that are public product names and may appear in the public profile even though a private
# repo shares the name. scripts/catalog.py check-public ignores these.
public_words: [wassup, frontend, algorythmos, algominutes]

