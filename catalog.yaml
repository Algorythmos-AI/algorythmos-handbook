    public: true
  agentic-armor:
    name: Agentic Armor
    summary: In development.
    url: null
    public: true
  algorythmos:
    name: Algorythmos company platform
    short: Algorythmos
    summary: Company website, document-processing API and its dashboard, docs and console.
    url: https://algorythmos.com
    public: false
  ichr:
    name: "Client: ICHR"
    short: ICHR
    aliases: [International Coalition for Human Rights]
    summary: International Coalition for Human Rights — trilingual (EN/AR/FR) newsroom.
    url: https://www.ichr-international.org
    public: true
  integrant:
    name: "Client: Integrant"
    short: Integrant
    summary: Integrant Pty Ltd internal document portal.
    url: null
    public: false
  client-sites:
    name: Client websites
    summary: Marketing sites built for small-business and community clients.
    url: null
    public: false
  visiononcare:
    name: Vision On Care
    summary: Archived March 2026 prototype of an operations platform for NDIS-style disability-support providers. Algorythmos IP, imported from the visiononcare org on 2026-09-25 and archived (read-only).
    url: null
    public: false
  trading-lab:
    name: Trading Lab
    aliases: [Options Lab]
    summary: Stocks and options paper-trading research — the stocks desk, the options workstation and the status dashboard, plus the original knowledge-base pipeline. Becomes Options Lab when its repo is renamed (D-026); see docs/trading-platforms.md.
    url: null
    public: false
  hft-lab:
    name: HFT Lab
    summary: High-frequency paper trading for the currency (forex) market — records its own tick data, trades on a broker paper account and retrains its models every week.
    url: null
    public: false
  crypto-lab:
    name: Crypto Lab
    summary: Crypto paper-trading desk on public market data and the lab's own simulator, with its learning loop. Closed on 2026-10-24 (trading-lab-research DEC-0036) and never cut over; archived.
    url: null
    public: false
  trading-kb:
    name: Trading Knowledge Base
    short: Trading KB
    summary: Shared, licence-restricted knowledge base for the three trading platforms — sources, extracts and verified claim cards, one collection per platform.
    url: null
    public: false
  pdf-algo-pro:
    name: PDF Algo Pro
    summary: Native PDF reader, editor and scanner for iPhone, iPad and Mac with private, on-device document intelligence.
    url: null
    public: false

