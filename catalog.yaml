# Algorythmos repository catalog — the single source of truth for what lives where.
#
# Humans: edit this file, then run `make render` and commit both files.
# Agents: read this file first. Never infer ownership, visibility or deploy targets from memory.
# `make validate` checks every entry against live GitHub (existence, visibility, default branch).
#
# Enums (enforced by scripts/catalog.py):
#   kind:        app | service | web | data | monorepo | library | infra | docs | ops | config
#   lifecycle:   active | dormant | deprecated | archived | planned
#                (the validator warns when an 'active' repo has had no push for 120 days)
#   visibility / intended_visibility: public | private
#   data_class:  public | internal | confidential | restricted
#   location:    org (Algorythmos-AI) | personal (skalaliya — to migrate)
#   licence:     proprietary (LICENSE, Algorythmos Pty Ltd) | notice (NOTICE.md) | pending (owner decision) | n/a
#   url:         optional — the live URL a newcomer can open (rendered as "Live at"); must answer 200

version: 1
updated: 2026-09-25

# Words that are public product names and may appear in the public profile even though a private
# repo shares the name. scripts/catalog.py check-public ignores these.
public_words: [wassup, frontend, algorythmos, algominutes]

products:
  gurbani-soul:
    name: Gurbani Soul
    aliases: [SGGS]
    summary: Sri Guru Granth Sahib Ji, verbatim and offline, cited by Ang — iPhone, iPad and web.
    url: https://gurbanisoul.com
    public: true
  algominutes:
    name: AlgoMinutes
    summary: AI meeting recorder — transcripts with speaker labels, structured minutes and action items.
    url: null
    public: true
  wassup:
    name: WASSUP
    aliases: [Wassup Doc, WASSUP Secretary, WASSUP Genesis]
    summary: AI for the clinic front desk — Secretary (phone receptionist), Wassup Doc (meeting notes), call analytics. Older generations kept for history; see docs/wassup-product-map.md.
    url: null
    public: true
  agentic-armor:
    name: Agentic Armor
    summary: In development.
    url: null
    public: true
  algorythmos:
    name: Algorythmos company platform
    short: Algorythmos
    summary: Company website, document-processing API and its dashboard, docs and console.
    url: https://algorythmos.com
    public: false
  ichr:
    name: "Client: ICHR"
    short: ICHR
    aliases: [International Coalition for Human Rights]
    summary: International Coalition for Human Rights — trilingual (EN/AR/FR) newsroom.
    url: https://www.ichr-international.org
    public: true
  integrant:
    name: "Client: Integrant"
    short: Integrant
    summary: Integrant Pty Ltd internal document portal.
    url: null
    public: false
  client-sites:
    name: Client websites
    summary: Marketing sites built for small-business and community clients.
    url: null
    public: false
  visiononcare:
    name: Vision On Care
    summary: Archived March 2026 prototype of an operations platform for NDIS-style disability-support providers. Algorythmos IP, imported from the visiononcare org on 2026-09-25 and archived (read-only).
    url: null
    public: false

