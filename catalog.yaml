# Algorythmos repository catalog — the single source of truth for what lives where.
#
# Humans: edit this file, then run `make render` and commit both files.
# Agents: read this file first. Never infer ownership, visibility or deploy targets from memory.
# `make validate` checks every entry against live GitHub (existence, visibility, default branch).
#
# Enums (enforced by scripts/catalog.py):
#   kind:        app | service | web | data | monorepo | library | infra | docs | ops | config
#   lifecycle:   active | dormant | deprecated | archived | planned
#                (active = pushed within 120 days; the validator warns when this drifts)
#   visibility / intended_visibility: public | private
#   data_class:  public | internal | confidential | restricted
#   location:    org (Algorythmos-AI) | personal (skalaliya — to migrate)

version: 1
updated: 2026-09-24

# Words that are public product names and may appear in the public profile even though a private
# repo shares the name. scripts/catalog.py check-public ignores these.
public_words: [wassup, frontend, algorythmos, algominutes]

products:
  gurbani-soul:
    name: Gurbani Soul
    summary: Sri Guru Granth Sahib Ji, verbatim and offline, cited by Ang — iPhone, iPad and web.
    url: https://gurbanisoul.com
    public: true
  algominutes:
    name: AlgoMinutes
    summary: AI meeting recorder — transcripts with speaker labels, structured minutes and action items.
    url: null
    public: true
  wassup:
    name: WASSUP platform
    summary: AI clinical-workflow platform — scheduling, encounters, transcription, documents, audit.
    url: null
    public: true
  agentic-armor:
    name: Agentic Armor
    summary: In development.
    url: null
    public: true
  algorythmos:
    name: Algorythmos company platform
    summary: Company website, document-processing API, docs, UI kit and console.
    url: https://algorythmos.com
    public: false
  ichr:
    name: "Client: ICHR"
    summary: International Coalition for Human Rights — trilingual (EN/AR/FR) newsroom.
    url: https://www.ichr-international.org
    public: true
  integrant:
    name: "Client: Integrant"
    summary: Integrant Pty Ltd internal document portal.
    url: null
    public: false
  client-sites:
    name: Client websites
    summary: Marketing sites built for small-business and community clients.
    url: null
    public: false

repos:
  # ── Gurbani Soul ────────────────────────────────────────────────────────────
  - repo: Algorythmos-AI/gurbani-soul-ios
    product: gurbani-soul
    kind: app
    location: org
    lifecycle: active
    visibility: public
    intended_visibility: public
    data_class: public
    default_branch: main
    deploys_to: [testflight, app-store]
    depends_on: [Algorythmos-AI/sggs-data, Algorythmos-AI/sggs-platform]
    notes: Consumes sggs-data by commit + sha256 (dataset.lock.json). If sggs-data goes private, CI needs a read token.
  - repo: Algorythmos-AI/sggs-platform
    product: gurbani-soul
    kind: monorepo
    location: org
    lifecycle: active
    visibility: public
    intended_visibility: private
    data_class: restricted
    default_branch: integration
    deploys_to: [render-api, vercel-web]
    depends_on: [Algorythmos-AI/sggs-data]
    notes: Formerly sggs-knowledge-base (GitHub redirects). Temporarily public; NOTICE.md says intended private.
  - repo: Algorythmos-AI/sggs-data
    product: gurbani-soul
    kind: data
    location: org
    lifecycle: active
    visibility: public
    intended_visibility: private
    data_class: restricted
    default_branch: main
    deploys_to: []
    depends_on: [Algorythmos-AI/sggs-source]
    notes: Temporarily public for Actions compute. Translation layer is licence-restricted — see NOTICE.md.
  - repo: Algorythmos-AI/sggs-source
    product: gurbani-soul
    kind: data
    location: org
    lifecycle: active
    visibility: private
    intended_visibility: private
    data_class: restricted
    default_branch: main
    deploys_to: [github-releases]
    notes: Non-redistributable source PDF and translation files. Release assets are never replaced.

  # ── AlgoMinutes ─────────────────────────────────────────────────────────────
  - repo: Algorythmos-AI/algominutes
